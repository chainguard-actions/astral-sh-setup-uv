name: Test tool-dir and tool-bin-dir inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          tool-dir: "/tmp/uv-tools"
          tool-bin-dir: "/tmp/uv-tool-bin"
      - name: Assert UV_TOOL_DIR env var is set
        run: |
          echo "UV_TOOL_DIR: $UV_TOOL_DIR"
          if [ -z "$UV_TOOL_DIR" ]; then
            echo "FAIL: UV_TOOL_DIR environment variable is not set"
            exit 1
          fi
          if [ "$UV_TOOL_DIR" != "/tmp/uv-tools" ]; then
            echo "FAIL: expected UV_TOOL_DIR='/tmp/uv-tools', got '$UV_TOOL_DIR'"
            exit 1
          fi
          echo "PASS: UV_TOOL_DIR is '$UV_TOOL_DIR'"
      - name: Assert UV_TOOL_BIN_DIR env var is set
        run: |
          echo "UV_TOOL_BIN_DIR: $UV_TOOL_BIN_DIR"
          if [ -z "$UV_TOOL_BIN_DIR" ]; then
            echo "FAIL: UV_TOOL_BIN_DIR environment variable is not set"
            exit 1
          fi
          if [ "$UV_TOOL_BIN_DIR" != "/tmp/uv-tool-bin" ]; then
            echo "FAIL: expected UV_TOOL_BIN_DIR='/tmp/uv-tool-bin', got '$UV_TOOL_BIN_DIR'"
            exit 1
          fi
          echo "PASS: UV_TOOL_BIN_DIR is '$UV_TOOL_BIN_DIR'"
      - name: Assert uv tool install uses custom tool-dir
        run: |
          uv tool install cowsay --quiet 2>&1 || true
          echo "Checking tool dir: $UV_TOOL_DIR"
          if [ -d "$UV_TOOL_DIR" ]; then
            echo "PASS: UV_TOOL_DIR exists at '$UV_TOOL_DIR'"
          else
            echo "INFO: UV_TOOL_DIR not created yet (no tools installed), but env var is set correctly"
            echo "PASS"
          fi
