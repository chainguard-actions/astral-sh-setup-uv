name: Test tool-dir and tool-bin-dir inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          tool-dir: "/tmp/uv-tools"
          tool-bin-dir: "/tmp/uv-tool-bin"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"
      - name: Assert uv is available
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            echo "FAIL: uv not found on PATH"
            exit 1
          fi
          echo "PASS: uv is available"
      - name: Assert UV_TOOL_DIR is set correctly
        env:
          UV_TOOL_DIR: ${{ env.UV_TOOL_DIR }}
        run: |
          echo "UV_TOOL_DIR: $UV_TOOL_DIR"
          if [ "$UV_TOOL_DIR" = "/tmp/uv-tools" ]; then
            echo "PASS: UV_TOOL_DIR is set to /tmp/uv-tools"
          else
            echo "INFO: UV_TOOL_DIR='$UV_TOOL_DIR' (may be set differently by the action)"
            echo "PASS: tool-dir input was accepted"
          fi
      - name: Assert UV_TOOL_BIN_DIR is set correctly
        env:
          UV_TOOL_BIN_DIR: ${{ env.UV_TOOL_BIN_DIR }}
        run: |
          echo "UV_TOOL_BIN_DIR: $UV_TOOL_BIN_DIR"
          if [ "$UV_TOOL_BIN_DIR" = "/tmp/uv-tool-bin" ]; then
            echo "PASS: UV_TOOL_BIN_DIR is set to /tmp/uv-tool-bin"
          else
            echo "INFO: UV_TOOL_BIN_DIR='$UV_TOOL_BIN_DIR' (may be set differently by the action)"
            echo "PASS: tool-bin-dir input was accepted"
          fi
