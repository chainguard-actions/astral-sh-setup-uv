name: Test tool-dir and tool-bin-dir inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-uv
        uses: .
        with:
          version: "latest"
          tool-dir: "/tmp/uv-tools"
          tool-bin-dir: "/tmp/uv-tool-bin"
          enable-cache: "false"
          ignore-empty-workdir: "true"

      - name: Assert UV_TOOL_DIR env var is set correctly
        run: |
          echo "UV_TOOL_DIR=$UV_TOOL_DIR"
          if [ "$UV_TOOL_DIR" != "/tmp/uv-tools" ]; then
            echo "FAIL: expected UV_TOOL_DIR='/tmp/uv-tools', got '$UV_TOOL_DIR'"
            exit 1
          fi
          echo "PASS: UV_TOOL_DIR=$UV_TOOL_DIR"

      - name: Assert UV_TOOL_BIN_DIR env var is set correctly
        run: |
          echo "UV_TOOL_BIN_DIR=$UV_TOOL_BIN_DIR"
          if [ "$UV_TOOL_BIN_DIR" != "/tmp/uv-tool-bin" ]; then
            echo "FAIL: expected UV_TOOL_BIN_DIR='/tmp/uv-tool-bin', got '$UV_TOOL_BIN_DIR'"
            exit 1
          fi
          echo "PASS: UV_TOOL_BIN_DIR=$UV_TOOL_BIN_DIR"

      - name: Assert uv is installed and functional
        run: |
          uv --version
          echo "PASS"
