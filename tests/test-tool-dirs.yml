name: Test custom tool-dir and tool-bin-dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare directories
        run: |
          mkdir -p /tmp/uv-cache
          mkdir -p /tmp/uv-tools
          mkdir -p /tmp/uv-tool-bin
      - id: action
        uses: .
        with:
          version: "latest"
          github-token: ${{ github.token }}
          tool-dir: "/tmp/uv-tools"
          tool-bin-dir: "/tmp/uv-tool-bin"
          cache-local-path: /tmp/uv-cache
      - name: Assert uv is installed
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv installed at version '$UV_VERSION'"
      - name: Assert UV_TOOL_DIR is set correctly
        run: |
          echo "UV_TOOL_DIR: $UV_TOOL_DIR"
          if [ -z "$UV_TOOL_DIR" ]; then
            echo "FAIL: UV_TOOL_DIR is not set"
            exit 1
          fi
          if [ "$UV_TOOL_DIR" != "/tmp/uv-tools" ]; then
            echo "FAIL: expected UV_TOOL_DIR='/tmp/uv-tools' but got '$UV_TOOL_DIR'"
            exit 1
          fi
          echo "PASS: UV_TOOL_DIR is '$UV_TOOL_DIR'"
      - name: Assert UV_TOOL_BIN_DIR is set correctly
        run: |
          echo "UV_TOOL_BIN_DIR: $UV_TOOL_BIN_DIR"
          if [ -z "$UV_TOOL_BIN_DIR" ]; then
            echo "FAIL: UV_TOOL_BIN_DIR is not set"
            exit 1
          fi
          if [ "$UV_TOOL_BIN_DIR" != "/tmp/uv-tool-bin" ]; then
            echo "FAIL: expected UV_TOOL_BIN_DIR='/tmp/uv-tool-bin' but got '$UV_TOOL_BIN_DIR'"
            exit 1
          fi
          echo "PASS: UV_TOOL_BIN_DIR is '$UV_TOOL_BIN_DIR'"
