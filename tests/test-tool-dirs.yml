name: Test custom tool-dir and tool-bin-dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "0.5.0"
          tool-dir: "/tmp/uv-tools"
          tool-bin-dir: "/tmp/uv-tool-bins"
          enable-cache: "false"
      - name: Assert UV_TOOL_DIR env var is set to custom path
        run: |
          echo "UV_TOOL_DIR: $UV_TOOL_DIR"
          if [ "$UV_TOOL_DIR" != "/tmp/uv-tools" ]; then
            echo "FAIL: expected UV_TOOL_DIR=/tmp/uv-tools, got $UV_TOOL_DIR"
            exit 1
          fi
          echo "PASS: UV_TOOL_DIR=/tmp/uv-tools"
      - name: Assert UV_TOOL_BIN_DIR env var is set to custom path
        run: |
          echo "UV_TOOL_BIN_DIR: $UV_TOOL_BIN_DIR"
          if [ "$UV_TOOL_BIN_DIR" != "/tmp/uv-tool-bins" ]; then
            echo "FAIL: expected UV_TOOL_BIN_DIR=/tmp/uv-tool-bins, got $UV_TOOL_BIN_DIR"
            exit 1
          fi
          echo "PASS: UV_TOOL_BIN_DIR=/tmp/uv-tool-bins"
      - name: Assert uv is still functional
        run: |
          uv --version
          echo "PASS: uv is functional with custom tool dirs"
