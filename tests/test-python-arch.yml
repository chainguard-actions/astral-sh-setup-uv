name: Test python-arch sets UV_PYTHON_ARCH
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          python-arch: "x86_64"
      - name: Assert UV_PYTHON_ARCH exported
        env:
          VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "uv-version: $VERSION"
          echo "UV_PYTHON_ARCH: $UV_PYTHON_ARCH"
          if [ -z "$VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          if [ "$UV_PYTHON_ARCH" != "x86_64" ]; then
            echo "FAIL: expected UV_PYTHON_ARCH=x86_64"
            exit 1
          fi
          uv cache dir
          echo "PASS"
