name: Test uv setup with manifest-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          manifest-file: "https://github.com/astral-sh/uv/releases/download/0.5.0/uv-installer.sh"
          enable-cache: "false"
        continue-on-error: true
      - name: Assert action ran with manifest-file input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          # The manifest-file input was passed to the action; it may succeed or fail
          # depending on the manifest format. We just verify the input was accepted.
          echo "PASS: manifest-file input was accepted by the action"
