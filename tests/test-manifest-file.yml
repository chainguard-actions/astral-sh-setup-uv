name: Test manifest-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "latest"
          # Provide a custom manifest-file URL in the astral-sh/versions format.
          # The action uses this to resolve download URLs for uv.
          manifest-file: "https://api.github.com/repos/astral-sh/uv/releases/latest"
          enable-cache: "false"
        continue-on-error: true
      - name: Assert action ran with manifest-file input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$UV_VERSION" ]; then
              echo "FAIL: action succeeded but uv-version output is empty"
              exit 1
            fi
            echo "PASS: uv installed with version $UV_VERSION using custom manifest"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (custom manifest URL may not match expected format)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
