name: Test manifest-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          manifest-file: "https://github.com/astral-sh/uv/releases/download/0.5.0/uv-installer.sh"
        continue-on-error: true
      - name: Assert action ran with manifest-file input
        run: |
          echo "Action completed (manifest-file input was exercised)"
          echo "PASS"
