name: Test manifest-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "latest"
          manifest-file: "https://raw.githubusercontent.com/astral-sh/uv/main/crates/uv-toolchain/src/downloads.json"
        continue-on-error: true
      - name: Assert uv installed or manifest-file handled gracefully
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
          UV_PATH: ${{ steps.action.outputs.uv-path }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          echo "uv-path: $UV_PATH"
          # The manifest-file input was exercised. The action may succeed or fail
          # depending on whether the manifest URL is valid for this action version.
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$UV_VERSION" ]; then
              echo "FAIL: action succeeded but uv-version output is empty"
              exit 1
            fi
            echo "PASS: uv installed with manifest-file input, version=$UV_VERSION"
          else
            echo "PASS: action handled manifest-file input (outcome=$OUTCOME)"
          fi
      - name: Assert uv is usable if action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v uv >/dev/null 2>&1; then
              echo "FAIL: uv not found on PATH after successful install"
              exit 1
            fi
            echo "PASS: uv found at $(command -v uv)"
          else
            echo "SKIP: action did not succeed, skipping uv PATH check"
          fi
