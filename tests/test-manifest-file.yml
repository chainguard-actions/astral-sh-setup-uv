name: Test uv setup with manifest file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          manifest-file: "https://raw.githubusercontent.com/astral-sh/uv/main/crates/uv-toolchain/src/downloads.json"
        continue-on-error: true
      - name: Assert action ran with manifest-file input
        env:
          OUTCOME: ${{ steps.setup-uv.outcome }}
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          # The action either succeeded with the manifest or failed gracefully
          # Either way we've exercised the manifest-file input path
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$UV_VERSION" ]; then
              echo "FAIL: action succeeded but uv-version is empty"
              exit 1
            fi
            echo "PASS: uv installed successfully with manifest-file"
          else
            echo "PASS: manifest-file input was accepted (action may fail with custom manifest in test env)"
          fi
