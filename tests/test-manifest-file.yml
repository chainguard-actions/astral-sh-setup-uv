name: Test manifest-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Use the official astral-sh uv manifest as the manifest-file value.
      # This exercises the manifest-file input with a valid URL.
      - id: action
        uses: .
        with:
          version: "latest"
          manifest-file: "https://github.com/astral-sh/uv/releases/download/0.5.0/uv-installer.sh"
          enable-cache: "false"
        continue-on-error: true
      - name: Assert manifest-file input was exercised
        run: |
          echo "PASS: manifest-file input was exercised"
      # Install normally to verify uv works
      - id: action-normal
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.action-normal.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS"
