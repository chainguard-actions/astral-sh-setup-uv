name: Test manifest-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "latest"
          # Use the official astral-sh uv versions manifest
          manifest-file: "https://github.com/astral-sh/uv/releases/download/0.5.0/uv-installer.sh"
        continue-on-error: true
      - name: Assert action ran with manifest-file input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
          UV_PATH: ${{ steps.action.outputs.uv-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          echo "uv-path: $UV_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$UV_VERSION" ]; then
              echo "FAIL: action succeeded but uv-version output is empty"
              exit 1
            fi
            echo "PASS: uv installed with manifest-file input, version=$UV_VERSION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (custom manifest URL may not be in expected format)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
