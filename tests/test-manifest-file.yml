name: Test manifest-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          # Use the official astral-sh/uv versions manifest (same format the action uses by default)
          manifest-file: "https://raw.githubusercontent.com/astral-sh/setup-uv/main/versions/uv.json"
      - name: Assert uv-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "actual uv-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          if [ "$ACTUAL" != "0.5.0" ]; then
            echo "FAIL: expected uv-version '0.5.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: uv-version=$ACTUAL"
      - name: Assert uv is on PATH
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            echo "FAIL: uv not found on PATH"
            exit 1
          fi
          echo "PASS: uv found at $(command -v uv)"
          uv --version
