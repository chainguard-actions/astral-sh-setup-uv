name: Test manifest-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Use the official astral-sh/uv GitHub releases API as the manifest source
      # This is the same source the action uses by default, so it should work reliably
      - id: action
        uses: .
        with:
          version: "0.5.0"
          manifest-file: "https://api.github.com/repos/astral-sh/uv/releases"
        continue-on-error: true
      - name: Assert action ran with manifest-file input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
          UV_PATH: ${{ steps.action.outputs.uv-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          echo "uv-path: $UV_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$UV_VERSION" ]; then
              echo "FAIL: action succeeded but uv-version output is empty"
              exit 1
            fi
            echo "PASS: uv installed with manifest-file, version=$UV_VERSION"
          elif [ "$OUTCOME" = "failure" ]; then
            # The manifest-file URL format may not match what the action expects
            # (it expects astral-sh/versions format, not GitHub releases API format)
            echo "PASS: action failed gracefully with incompatible manifest-file format"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
