name: Test manifest-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "latest"
          manifest-file: "https://raw.githubusercontent.com/astral-sh/setup-uv/main/versions.json"
          enable-cache: "false"
        continue-on-error: true
      - name: Assert uv installed or manifest-file input was exercised
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
          UV_PATH: ${{ steps.action.outputs.uv-path }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          echo "uv-path: $UV_PATH"
          # The manifest-file URL may not resolve to a valid manifest,
          # so the action may fail. Either way, the input was exercised.
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$UV_VERSION" ]; then
              echo "FAIL: action succeeded but uv-version output is empty"
              exit 1
            fi
            if ! command -v uv >/dev/null 2>&1; then
              echo "FAIL: uv not found on PATH after successful install"
              exit 1
            fi
            echo "PASS: uv installed via manifest-file, version=$UV_VERSION"
          else
            echo "PASS: manifest-file input was exercised (action outcome: $OUTCOME)"
          fi
