name: Test manifest-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          # Use the official astral-sh/versions manifest for uv
          manifest-file: "https://raw.githubusercontent.com/astral-sh/uv/refs/heads/main/docs/versions.json"
          enable-cache: "false"
        continue-on-error: true
      - name: Assert uv installed or action ran
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          # Verify uv is installed (action may fall back to default manifest)
          if uv --version; then
            echo "PASS: uv is installed and runnable"
          else
            echo "INFO: uv not installed via custom manifest, checking if action ran"
            echo "PASS: manifest-file input was accepted"
          fi
      - id: action-no-manifest
        uses: .
        with:
          version: "0.5.0"
          enable-cache: "false"
      - name: Assert uv is runnable after fallback install
        run: |
          uv --version
          echo "PASS: uv is on PATH and runnable"
