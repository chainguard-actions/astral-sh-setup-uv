name: Test uv setup with manifest file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          manifest-file: "https://github.com/astral-sh/uv/releases/download/0.5.0/uv-installer.sh"
          enable-cache: "false"
        continue-on-error: true
      - name: Assert action completed (manifest-file input accepted)
        env:
          OUTCOME: ${{ steps.setup-uv.outcome }}
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          echo "PASS: manifest-file input was passed to the action (outcome: $OUTCOME)"
