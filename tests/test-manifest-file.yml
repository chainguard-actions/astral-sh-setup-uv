name: Test uv setup with manifest-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Test that the manifest-file input is accepted by the action.
      # Using the official astral-sh versions manifest URL.
      - id: action
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          manifest-file: "https://github.com/astral-sh/uv/releases/download/0.5.0/uv-installer.sh"
        continue-on-error: true
      - name: Assert action ran with manifest-file input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "PASS: manifest-file input was accepted by the action"
