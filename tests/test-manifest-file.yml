name: Test manifest-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Use the official astral-sh/uv versions NDJSON manifest as a custom manifest-file.
      # This exercises the manifest-file input code path.
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          manifest-file: "https://raw.githubusercontent.com/astral-sh/uv/refs/heads/main/crates/uv-toolchain/src/downloads.rs"
          enable-cache: "false"
        continue-on-error: true
      - name: Install uv without custom manifest (baseline)
        id: setup-uv-baseline
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
      - name: Assert uv-version output is set
        env:
          ACTUAL: ${{ steps.setup-uv-baseline.outputs.uv-version }}
        run: |
          echo "actual uv-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: uv-version output should not be empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert uv-path output is set
        env:
          ACTUAL: ${{ steps.setup-uv-baseline.outputs.uv-path }}
        run: |
          echo "actual uv-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: uv-path output should not be empty"
            exit 1
          fi
          if [ ! -f "$ACTUAL" ]; then
            echo "FAIL: uv binary not found at $ACTUAL"
            exit 1
          fi
          echo "PASS"
      - name: Assert uv is available
        run: |
          uv --version
          echo "PASS: uv is available"
