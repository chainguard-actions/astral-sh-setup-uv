name: Test manifest-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "0.5.0"
          manifest-file: "https://raw.githubusercontent.com/astral-sh/versions/refs/heads/main/uv.json"
          enable-cache: "false"
      - name: Assert uv-version output is set
        env:
          ACTUAL: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$ACTUAL"
      - name: Assert uv is executable
        run: |
          if ! uv --version; then
            echo "FAIL: uv is not executable"
            exit 1
          fi
          echo "PASS"
