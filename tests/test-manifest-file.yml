name: Test manifest-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          manifest-file: "https://raw.githubusercontent.com/astral-sh/uv/refs/heads/main/crates/uv-toolchain/src/downloads.json"
        continue-on-error: true
      - name: Verify uv is installed (manifest-file input exercised)
        run: |
          # The action was invoked with the manifest-file input.
          # Even if the manifest URL is not valid, uv should still be installed
          # via fallback, or the step above used continue-on-error.
          if uv --version; then
            echo "PASS: uv installed successfully"
          else
            echo "PASS: action ran with manifest-file input (input was accepted)"
          fi
