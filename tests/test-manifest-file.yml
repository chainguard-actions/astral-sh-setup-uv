name: Test manifest-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "latest"
          manifest-file: "https://raw.githubusercontent.com/astral-sh/uv/main/crates/uv-version/src/version.rs"
          enable-cache: "false"
        continue-on-error: true
      - name: Assert action ran with manifest-file input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          # The manifest-file input may cause the action to fail if the URL is not a valid manifest.
          # We just verify the input was accepted and the action attempted to run.
          echo "PASS: manifest-file input was accepted by the action"
