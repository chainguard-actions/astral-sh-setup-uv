name: Test manifest-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          manifest-file: "https://raw.githubusercontent.com/astral-sh/versions/main/v1/uv.ndjson"
          enable-cache: "false"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"
      - name: Assert uv binary is executable and works
        run: |
          echo "Running: uv --version"
          uv --version
          if [ $? -ne 0 ]; then
            echo "FAIL: uv --version failed"
            exit 1
          fi
          echo "PASS: uv is executable (installed via custom manifest-file)"
