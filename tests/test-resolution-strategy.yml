name: Test resolution-strategy input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-uv-highest
        uses: .
        with:
          version: ">=0.5.0"
          resolution-strategy: "highest"
          enable-cache: "false"
          ignore-empty-workdir: "true"

      - name: Assert uv-version output is set (highest strategy)
        env:
          UV_VERSION: ${{ steps.setup-uv-highest.outputs.uv-version }}
        run: |
          echo "uv-version (highest): $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"

      - name: Assert uv binary is available
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            echo "FAIL: uv not found on PATH"
            exit 1
          fi
          uv --version
          echo "PASS: uv found at $(command -v uv)"
