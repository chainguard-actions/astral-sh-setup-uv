name: Test cache enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare cache directory
        run: mkdir -p /tmp/uv-cache
      - id: action
        uses: .
        with:
          version: "latest"
          github-token: ${{ github.token }}
          enable-cache: "true"
          cache-suffix: "test-cache-enabled"
          cache-dependency-glob: ""
          cache-local-path: /tmp/uv-cache
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv installed at version '$UV_VERSION'"
      - name: Assert cache-hit output is a boolean string
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ]; then
            echo "FAIL: cache-hit should be 'true' or 'false', got '$CACHE_HIT'"
            exit 1
          fi
          echo "PASS: cache-hit is '$CACHE_HIT' (valid boolean)"
      - name: Assert uv is on PATH
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            echo "FAIL: uv not found on PATH"
            exit 1
          fi
          echo "PASS: uv is available at $(command -v uv)"
