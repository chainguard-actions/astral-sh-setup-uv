name: Test cache enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "true"
      - name: Assert uv-version output is non-empty
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version is $UV_VERSION"
      - name: Assert cache-hit output is set
        env:
          CACHE_HIT: ${{ steps.setup-uv.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # cache-hit should be either 'true' or 'false' (not empty)
          if [ -z "$CACHE_HIT" ]; then
            echo "FAIL: cache-hit output is empty"
            exit 1
          fi
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ]; then
            echo "FAIL: cache-hit should be 'true' or 'false', got: $CACHE_HIT"
            exit 1
          fi
          echo "PASS: cache-hit is '$CACHE_HIT'"
      - name: Assert uv is available in PATH
        run: |
          if ! command -v uv &>/dev/null; then
            echo "FAIL: uv not found in PATH"
            exit 1
          fi
          echo "PASS: uv found at $(which uv)"
