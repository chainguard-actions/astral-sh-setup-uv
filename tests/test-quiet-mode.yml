name: Test quiet mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          quiet: "true"
      - name: Assert uv-version output is set even in quiet mode
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty in quiet mode"
            exit 1
          fi
          echo "PASS: uv-version is '$UV_VERSION' in quiet mode"
      - name: Assert uv binary is available in quiet mode
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            echo "FAIL: uv not found on PATH in quiet mode"
            exit 1
          fi
          echo "PASS: uv is available in quiet mode"
