name: Test version-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-uv
        uses: .
        with:
          version-file: "tests/fixtures/pyproject-version/pyproject.toml"
          enable-cache: "false"

      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"

      - name: Assert uv binary is available
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            echo "FAIL: uv not found on PATH"
            exit 1
          fi
          echo "PASS: uv is available"

      - name: Assert installed version satisfies constraint (>=0.5.0)
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          MAJOR=$(echo "$UV_VERSION" | cut -d. -f1)
          MINOR=$(echo "$UV_VERSION" | cut -d. -f2)
          PATCH=$(echo "$UV_VERSION" | cut -d. -f3)
          # Version must be >= 0.5.0
          if [ "$MAJOR" -gt 0 ]; then
            echo "PASS: version $UV_VERSION >= 0.5.0"
          elif [ "$MAJOR" -eq 0 ] && [ "$MINOR" -gt 5 ]; then
            echo "PASS: version $UV_VERSION >= 0.5.0"
          elif [ "$MAJOR" -eq 0 ] && [ "$MINOR" -eq 5 ] && [ "$PATCH" -ge 0 ]; then
            echo "PASS: version $UV_VERSION >= 0.5.0"
          else
            echo "FAIL: version $UV_VERSION does not satisfy >=0.5.0"
            exit 1
          fi
