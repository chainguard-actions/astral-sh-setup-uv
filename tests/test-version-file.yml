name: Test version-file input reads uv version from pyproject.toml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create pyproject.toml with uv version constraint
        run: |
          cat > /tmp/test-pyproject.toml << 'EOF'
          [tool.uv]
          required-version = ">=0.5.0"
          EOF
          cat /tmp/test-pyproject.toml

      - id: setup-uv
        uses: .
        with:
          version-file: "/tmp/test-pyproject.toml"
          enable-cache: "false"

      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"

      - name: Assert uv is functional
        run: |
          uv --version
          echo "PASS: uv is functional"
