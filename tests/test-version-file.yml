name: Test uv version from version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version-file: "${{ github.workspace }}/tests/fixtures/version-file/.tool-versions"
          enable-cache: "false"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"
      - name: Assert uv binary reports version from file
        run: |
          INSTALLED=$(uv --version | awk '{print $2}')
          echo "installed version: $INSTALLED"
          if [ "$INSTALLED" != "0.5.1" ]; then
            echo "FAIL: expected uv 0.5.1 from version file, got $INSTALLED"
            exit 1
          fi
          echo "PASS: uv version matches version file (0.5.1)"
      - name: Assert uv-path output is set
        env:
          UV_PATH: ${{ steps.setup-uv.outputs.uv-path }}
        run: |
          echo "uv-path: $UV_PATH"
          if [ -z "$UV_PATH" ]; then
            echo "FAIL: uv-path output is empty"
            exit 1
          fi
          echo "PASS: uv-path=$UV_PATH"
