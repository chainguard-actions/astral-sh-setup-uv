name: Test version-file from pyproject.toml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version-file: ${{ github.workspace }}/tests/fixtures/version-file/pyproject.toml
          enable-cache: "false"
      - name: Assert version from file
        env:
          VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "version: $VERSION"
          if [ "$VERSION" != "0.5.1" ]; then
            echo "FAIL: expected 0.5.1"
            exit 1
          fi
          uv --version | grep -q "0.5.1" || { echo "FAIL: uv on PATH not 0.5.1"; exit 1; }
          echo "PASS"
