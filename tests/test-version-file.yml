name: Test version-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version-file: "tests/fixtures/pyproject-with-uv-version/pyproject.toml"
          enable-cache: "false"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version is '$UV_VERSION'"
      - name: Assert uv is functional
        run: |
          echo "uv version: $(uv --version)"
          if ! uv --version; then
            echo "FAIL: uv is not functional"
            exit 1
          fi
          echo "PASS: uv is functional"
      - name: Assert installed version satisfies constraint
        run: |
          INSTALLED="$(uv --version | awk '{print $2}')"
          echo "installed version: $INSTALLED"
          # Version should be >= 0.5.0 (the constraint in the fixture)
          MAJOR=$(echo "$INSTALLED" | cut -d. -f1)
          MINOR=$(echo "$INSTALLED" | cut -d. -f2)
          PATCH=$(echo "$INSTALLED" | cut -d. -f3 | cut -d- -f1)
          echo "parsed: major=$MAJOR minor=$MINOR patch=$PATCH"
          # Check version >= 0.5.0
          if [ "$MAJOR" -gt 0 ]; then
            echo "PASS: version $INSTALLED >= 0.5.0"
          elif [ "$MAJOR" -eq 0 ] && [ "$MINOR" -ge 5 ]; then
            echo "PASS: version $INSTALLED >= 0.5.0"
          else
            echo "FAIL: version $INSTALLED is less than 0.5.0"
            exit 1
          fi
