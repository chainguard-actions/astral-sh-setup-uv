name: Test version-file input with .tool-versions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version-file: "${{ github.workspace }}/tests/fixtures/tool-versions/.tool-versions"
          enable-cache: "false"
          ignore-empty-workdir: "true"
      - name: Assert uv-version output matches version from file
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          if [ "$UV_VERSION" != "0.5.0" ]; then
            echo "FAIL: expected version 0.5.0 from .tool-versions but got $UV_VERSION"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION matches .tool-versions"
      - name: Assert uv binary reports correct version
        run: |
          INSTALLED=$(uv --version | awk '{print $2}')
          echo "installed version: $INSTALLED"
          if [ "$INSTALLED" != "0.5.0" ]; then
            echo "FAIL: expected uv 0.5.0 but got $INSTALLED"
            exit 1
          fi
          echo "PASS: uv version matches .tool-versions"
