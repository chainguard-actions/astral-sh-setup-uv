name: Test version-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version-file: "${{ github.workspace }}/tests/fixtures/version-file/pyproject.toml"
          enable-cache: "false"
          ignore-empty-workdir: "true"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"
      - name: Assert uv binary reports correct version
        run: |
          INSTALLED=$(uv --version | awk '{print $2}')
          echo "installed version: $INSTALLED"
          if [ "$INSTALLED" != "0.5.0" ]; then
            echo "FAIL: expected uv version '0.5.0' from version-file but got '$INSTALLED'"
            exit 1
          fi
          echo "PASS: uv version matches version-file"
