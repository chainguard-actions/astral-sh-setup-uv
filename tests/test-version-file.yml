name: Test version from version-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create version file
        run: |
          mkdir -p /tmp/uv-version-test
          # For uv.toml, required-version is at the top level (not under [tool.uv])
          printf 'required-version = "0.5.0"\n' > /tmp/uv-version-test/uv.toml
          echo "Contents of /tmp/uv-version-test/uv.toml:"
          cat /tmp/uv-version-test/uv.toml
      - id: setup-uv
        uses: .
        with:
          version-file: "/tmp/uv-version-test/uv.toml"
          enable-cache: "false"
          ignore-empty-workdir: "true"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"
      - name: Assert uv version matches version file
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ "$UV_VERSION" != "0.5.0" ]; then
            echo "FAIL: expected uv-version=0.5.0 (from version file), got $UV_VERSION"
            exit 1
          fi
          echo "PASS: version from file correctly used: $UV_VERSION"
      - name: Assert uv is on PATH
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            echo "FAIL: uv not found on PATH"
            exit 1
          fi
          echo "PASS: uv found on PATH at $(command -v uv)"
