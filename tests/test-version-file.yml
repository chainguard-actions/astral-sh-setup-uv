name: Test version-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version-file: "tests/fixtures/pyproject-with-uv-version/pyproject.toml"
          enable-cache: "false"

      - name: Assert uv-version output matches version from file
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ "$UV_VERSION" != "0.5.0" ]; then
            echo "FAIL: expected uv-version '0.5.0' from version-file but got '$UV_VERSION'"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"

      - name: Assert uv binary reports correct version from file
        run: |
          ACTUAL=$(uv --version)
          echo "uv --version: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "0.5.0"; then
            echo "FAIL: expected uv version 0.5.0 in output '$ACTUAL'"
            exit 1
          fi
          echo "PASS: uv version matches version-file"
