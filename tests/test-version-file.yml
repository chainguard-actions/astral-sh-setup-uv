name: Test version-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create pyproject.toml with uv version constraint
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/version-file"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/version-file/pyproject.toml" << 'EOF'
          [tool.uv]
          required-version = ">=0.5.0"
          EOF
      - id: setup-uv
        uses: .
        with:
          version-file: "tests/fixtures/version-file/pyproject.toml"
          enable-cache: "false"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version is '$UV_VERSION'"
      - name: Assert uv binary is available
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            echo "FAIL: uv not found on PATH"
            exit 1
          fi
          echo "PASS: uv is available"
