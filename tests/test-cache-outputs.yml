name: Test cache outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: setup-uv
        uses: .
        with:
          version: "0.5.0"
          enable-cache: "true"
          restore-cache: "true"
          save-cache: "false"
      - name: Assert cache-key output is set
        env:
          CACHE_KEY: ${{ steps.setup-uv.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "FAIL: cache-key output is empty"
            exit 1
          fi
          echo "PASS: cache-key=$CACHE_KEY"
      - name: Assert cache-hit output is a boolean string
        env:
          CACHE_HIT: ${{ steps.setup-uv.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ] && [ "$CACHE_HIT" != "" ]; then
            echo "FAIL: cache-hit should be 'true', 'false', or empty, got '$CACHE_HIT'"
            exit 1
          fi
          echo "PASS: cache-hit=$CACHE_HIT"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"
