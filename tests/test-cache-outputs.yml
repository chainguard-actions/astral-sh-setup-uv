name: Test cache outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "true"
          save-cache: "false"
      - name: Assert cache-key output is set
        env:
          CACHE_KEY: ${{ steps.setup-uv.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "FAIL: cache-key output is empty"
            exit 1
          fi
          echo "PASS: cache-key is '$CACHE_KEY'"
      - name: Assert cache-hit output is a boolean string
        env:
          CACHE_HIT: ${{ steps.setup-uv.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ] && [ "$CACHE_HIT" != "" ]; then
            echo "FAIL: cache-hit should be 'true', 'false', or empty, got '$CACHE_HIT'"
            exit 1
          fi
          echo "PASS: cache-hit is '$CACHE_HIT'"
      - name: Assert uv is still functional after cache restore
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            echo "FAIL: uv not found on PATH after cache restore"
            exit 1
          fi
          echo "PASS: uv is available"
