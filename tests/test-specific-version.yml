name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-uv
        uses: .
        with:
          version: "0.5.0"
          enable-cache: "false"
          ignore-empty-workdir: "true"

      - name: Assert uv-version output matches requested version
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ "$UV_VERSION" != "0.5.0" ]; then
            echo "FAIL: expected uv-version '0.5.0', got '$UV_VERSION'"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"

      - name: Assert uv binary reports correct version
        run: |
          INSTALLED=$(uv --version | awk '{print $2}')
          echo "installed version: $INSTALLED"
          if [ "$INSTALLED" != "0.5.0" ]; then
            echo "FAIL: expected uv version '0.5.0', got '$INSTALLED'"
            exit 1
          fi
          echo "PASS"

      - name: Assert uv-path output points to existing file
        env:
          UV_PATH: ${{ steps.setup-uv.outputs.uv-path }}
        run: |
          echo "uv-path: $UV_PATH"
          if [ ! -f "$UV_PATH" ]; then
            echo "FAIL: uv binary not found at $UV_PATH"
            exit 1
          fi
          echo "PASS"
