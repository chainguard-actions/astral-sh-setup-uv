name: Test custom venv-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-uv
        uses: .
        with:
          version: "0.5.0"
          activate-environment: "true"
          venv-path: ".custom-venv"
          no-project: "true"
          enable-cache: "false"

      - name: Assert venv output points to custom path
        env:
          VENV_PATH: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "venv output: $VENV_PATH"
          if [ -z "$VENV_PATH" ]; then
            echo "FAIL: venv output is empty"
            exit 1
          fi
          # Check that the path contains our custom venv name
          if [[ "$VENV_PATH" != *".custom-venv"* ]]; then
            echo "FAIL: venv path '$VENV_PATH' does not contain '.custom-venv'"
            exit 1
          fi
          echo "PASS: venv path contains custom name"

      - name: Assert custom venv directory exists
        run: |
          VENV_DIR="$GITHUB_WORKSPACE/.custom-venv"
          echo "checking venv at: $VENV_DIR"
          if [ ! -d "$VENV_DIR" ]; then
            echo "FAIL: custom venv directory does not exist at $VENV_DIR"
            exit 1
          fi
          echo "PASS: custom venv directory exists"

      - name: Assert uv is functional
        run: |
          if ! uv --version; then
            echo "FAIL: uv is not functional"
            exit 1
          fi
          echo "PASS: uv is functional"
