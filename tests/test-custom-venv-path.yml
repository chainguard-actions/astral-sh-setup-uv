name: Test custom virtual environment path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "0.5.0"
          activate-environment: "true"
          venv-path: "/tmp/my-custom-venv"
          enable-cache: "false"
          ignore-empty-workdir: "true"
      - name: Assert venv output matches custom path
        env:
          VENV_PATH: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "venv output: $VENV_PATH"
          if [ -z "$VENV_PATH" ]; then
            echo "FAIL: venv output is empty"
            exit 1
          fi
          if [ "$VENV_PATH" != "/tmp/my-custom-venv" ]; then
            echo "FAIL: expected venv path '/tmp/my-custom-venv', got '$VENV_PATH'"
            exit 1
          fi
          echo "PASS: venv=$VENV_PATH"
      - name: Assert custom venv directory exists
        run: |
          echo "Checking custom venv directory at: /tmp/my-custom-venv"
          if [ ! -d "/tmp/my-custom-venv" ]; then
            echo "FAIL: custom venv directory does not exist at /tmp/my-custom-venv"
            exit 1
          fi
          echo "PASS: custom venv directory exists"
      - name: Assert uv is on PATH
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            echo "FAIL: uv not found on PATH"
            exit 1
          fi
          echo "PASS: uv found on PATH at $(command -v uv)"
