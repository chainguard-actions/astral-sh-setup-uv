name: Test custom venv-path with activate-environment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-uv
        uses: .
        with:
          version: "latest"
          activate-environment: "true"
          venv-path: "/tmp/my-custom-venv"
          no-project: "true"
          enable-cache: "false"
          ignore-empty-workdir: "true"

      - name: Assert venv output matches custom path
        env:
          VENV_PATH: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "venv output: $VENV_PATH"
          if [ "$VENV_PATH" != "/tmp/my-custom-venv" ]; then
            echo "FAIL: expected venv path '/tmp/my-custom-venv', got '$VENV_PATH'"
            exit 1
          fi
          echo "PASS: venv path matches"

      - name: Assert custom venv directory exists
        run: |
          if [ ! -d "/tmp/my-custom-venv" ]; then
            echo "FAIL: custom venv directory does not exist at /tmp/my-custom-venv"
            exit 1
          fi
          echo "PASS: custom venv directory exists"

      - name: Assert custom venv has activate script
        run: |
          if [ ! -f "/tmp/my-custom-venv/bin/activate" ]; then
            echo "FAIL: activate script not found in custom venv"
            ls /tmp/my-custom-venv/bin/ || true
            exit 1
          fi
          echo "PASS: activate script found"
