name: Test activate-environment with custom venv path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "0.5.0"
          activate-environment: "true"
          venv-path: ".custom-venv"
          no-project: "true"
          enable-cache: "false"
      - name: Assert venv output points to custom path
        env:
          VENV: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "venv: $VENV"
          if [ -z "$VENV" ]; then
            echo "FAIL: venv output is empty"
            exit 1
          fi
          # Check that the venv path contains the custom name
          if [[ "$VENV" != *".custom-venv"* ]]; then
            echo "FAIL: expected venv path to contain '.custom-venv', got $VENV"
            exit 1
          fi
          echo "PASS: venv=$VENV"
      - name: Assert custom venv directory exists
        run: |
          VENV_PATH="$GITHUB_WORKSPACE/.custom-venv"
          echo "Checking custom venv directory: $VENV_PATH"
          if [ ! -d "$VENV_PATH" ]; then
            echo "FAIL: custom venv directory does not exist at $VENV_PATH"
            exit 1
          fi
          echo "PASS: custom venv directory exists"
