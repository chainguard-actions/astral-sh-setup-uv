name: Test activate-environment with custom venv-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          activate-environment: "true"
          venv-path: "/tmp/my-custom-venv"

      - name: Assert venv output matches custom path
        env:
          VENV: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "venv: $VENV"
          if [ "$VENV" != "/tmp/my-custom-venv" ]; then
            echo "FAIL: expected venv '/tmp/my-custom-venv' but got '$VENV'"
            exit 1
          fi
          echo "PASS: venv=$VENV"

      - name: Assert custom venv directory exists
        run: |
          if [ ! -d "/tmp/my-custom-venv" ]; then
            echo "FAIL: custom venv directory '/tmp/my-custom-venv' does not exist"
            exit 1
          fi
          echo "PASS: custom venv directory exists"

      - name: Assert python is available in the venv
        run: |
          if [ ! -f "/tmp/my-custom-venv/bin/python" ] && [ ! -f "/tmp/my-custom-venv/bin/python3" ]; then
            echo "FAIL: python not found in custom venv"
            exit 1
          fi
          echo "PASS: python found in custom venv"
