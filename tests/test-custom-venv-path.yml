name: Test custom venv-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          activate-environment: "true"
          venv-path: ".custom-venv"
          no-project: "true"
      - name: Assert venv output points to custom path
        env:
          VENV: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "venv: $VENV"
          if [ -z "$VENV" ]; then
            echo "FAIL: venv output is empty"
            exit 1
          fi
          if ! echo "$VENV" | grep -q ".custom-venv"; then
            echo "FAIL: expected venv path to contain '.custom-venv', got '$VENV'"
            exit 1
          fi
          echo "PASS: venv output contains '.custom-venv'"
      - name: Assert custom venv directory exists
        run: |
          CUSTOM_VENV="$GITHUB_WORKSPACE/.custom-venv"
          echo "Checking custom venv directory: $CUSTOM_VENV"
          if [ ! -d "$CUSTOM_VENV" ]; then
            echo "FAIL: custom venv directory does not exist at '$CUSTOM_VENV'"
            exit 1
          fi
          echo "PASS: custom venv directory exists"
