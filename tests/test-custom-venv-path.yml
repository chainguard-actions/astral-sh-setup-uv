name: Test custom venv-path with activate-environment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-uv
        uses: .
        with:
          version: "0.5.0"
          activate-environment: "true"
          venv-path: ".custom-venv"
          enable-cache: "false"

      - name: Assert venv output matches custom path
        env:
          VENV_PATH: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "venv output: $VENV_PATH"
          if [ -z "$VENV_PATH" ]; then
            echo "FAIL: venv output is empty"
            exit 1
          fi
          # Check that the venv path contains the custom name
          if [[ "$VENV_PATH" != *".custom-venv"* ]]; then
            echo "FAIL: expected venv path to contain '.custom-venv' but got '$VENV_PATH'"
            exit 1
          fi
          echo "PASS: venv path contains custom name: $VENV_PATH"

      - name: Assert custom venv directory exists
        run: |
          CUSTOM_VENV=".custom-venv"
          echo "checking custom venv directory: $CUSTOM_VENV"
          if [ ! -d "$CUSTOM_VENV" ]; then
            echo "FAIL: custom venv directory does not exist at $CUSTOM_VENV"
            exit 1
          fi
          echo "PASS: custom venv directory exists"

      - name: Assert uv is functional
        run: |
          if ! uv --version; then
            echo "FAIL: uv is not functional"
            exit 1
          fi
          echo "PASS: uv is functional"
