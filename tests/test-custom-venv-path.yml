name: Test activate-environment with custom venv-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest-known"
          activate-environment: "true"
          venv-path: ".custom-venv"
          no-project: "true"
          enable-cache: "false"
          ignore-empty-workdir: "true"
      - name: Assert venv output points to custom path
        env:
          VENV_PATH: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "venv output: $VENV_PATH"
          if [ -z "$VENV_PATH" ]; then
            echo "FAIL: venv output is empty"
            exit 1
          fi
          # Check that the custom path is used
          if [[ "$VENV_PATH" != *".custom-venv"* ]]; then
            echo "FAIL: venv path '$VENV_PATH' does not contain '.custom-venv'"
            exit 1
          fi
          echo "PASS: venv path contains custom directory"
      - name: Assert custom venv directory exists
        run: |
          if [ ! -d ".custom-venv" ]; then
            echo "FAIL: custom venv directory .custom-venv does not exist"
            exit 1
          fi
          echo "PASS: custom venv directory exists"
