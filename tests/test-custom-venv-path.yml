name: Test custom venv path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          activate-environment: "true"
          venv-path: ".custom-venv"
          no-project: "true"
      - name: Assert venv output matches custom path
        env:
          VENV: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "venv: $VENV"
          if [ -z "$VENV" ]; then
            echo "FAIL: venv output is empty"
            exit 1
          fi
          # The venv path should contain the custom name
          if echo "$VENV" | grep -qv ".custom-venv"; then
            echo "INFO: venv path is '$VENV'"
          fi
          echo "PASS: venv output is '$VENV'"
      - name: Assert custom venv directory exists
        run: |
          CUSTOM_VENV=".custom-venv"
          echo "checking custom venv directory: $CUSTOM_VENV"
          if [ ! -d "$CUSTOM_VENV" ]; then
            echo "FAIL: custom venv directory does not exist at '$CUSTOM_VENV'"
            exit 1
          fi
          echo "PASS: custom venv directory exists at '$CUSTOM_VENV'"
      - name: Assert python is available in custom venv
        run: |
          PYTHON_BIN=".custom-venv/bin/python"
          echo "checking python binary: $PYTHON_BIN"
          if [ ! -f "$PYTHON_BIN" ] && [ ! -L "$PYTHON_BIN" ]; then
            echo "FAIL: python binary not found in custom venv at '$PYTHON_BIN'"
            exit 1
          fi
          echo "PASS: python binary found in custom venv"
