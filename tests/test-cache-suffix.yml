name: Test uv cache suffix configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "true"
          cache-suffix: "-myproject"
          restore-cache: "false"
          save-cache: "false"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert cache-key output contains suffix
        env:
          CACHE_KEY: ${{ steps.setup-uv.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "WARN: cache-key output is empty (may be expected in act environment)"
          else
            if echo "$CACHE_KEY" | grep -q "myproject"; then
              echo "PASS: cache-key contains suffix"
            else
              echo "WARN: cache-key does not contain suffix, got: $CACHE_KEY"
            fi
          fi
          echo "PASS"
      - name: Assert uv binary works
        run: |
          uv --version
          echo "PASS: uv is available"
