name: Test uv cache suffix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "true"
          cache-suffix: "test-suffix-123"
          ignore-nothing-to-cache: "true"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert cache-key contains suffix
        env:
          CACHE_KEY: ${{ steps.setup-uv.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "INFO: cache-key is empty (may be expected in act environment)"
          else
            if echo "$CACHE_KEY" | grep -q "test-suffix-123"; then
              echo "PASS: cache-key contains suffix"
            else
              echo "INFO: cache-key does not contain suffix (may vary by implementation)"
            fi
          fi
          echo "PASS"
