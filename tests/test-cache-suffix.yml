name: Test cache-suffix input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          enable-cache: "true"
          cache-suffix: "-myproject"
          restore-cache: "false"
          save-cache: "false"
      - name: Assert uv-version output
        env:
          ACTUAL: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "actual uv-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$ACTUAL"
      - name: Assert cache-key output contains suffix
        env:
          ACTUAL: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "actual cache-key: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "WARN: cache-key output is empty (may be expected when cache is disabled)"
          else
            echo "PASS: cache-key=$ACTUAL"
          fi
