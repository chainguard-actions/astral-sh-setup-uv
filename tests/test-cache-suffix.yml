name: Test cache-suffix input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          cache-suffix: "-test-suffix"
          enable-cache: "false"
      - name: Assert uv-version output is set
        env:
          ACTUAL: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "actual uv-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: uv-version output should not be empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert uv is available
        run: |
          uv --version
          echo "PASS: uv is available"
