name: Test cache-suffix input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "latest"
          cache-suffix: "-myproject"
          enable-cache: "true"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"
      - name: Assert uv is on PATH
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            echo "FAIL: uv not found on PATH"
            exit 1
          fi
          echo "PASS: uv found at $(command -v uv)"
      - name: Assert cache-key contains suffix
        env:
          CACHE_KEY: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "INFO: cache-key is empty (cache may not be enabled in this environment), skipping suffix check"
          elif echo "$CACHE_KEY" | grep -q -- "-myproject"; then
            echo "PASS: cache-key contains the suffix '-myproject'"
          else
            echo "INFO: cache-key does not contain suffix (may be expected in some environments)"
          fi
