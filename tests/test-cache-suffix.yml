name: Test cache-suffix input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          cache-suffix: "-my-suffix"
          enable-cache: "false"
      - name: Assert uv-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected uv-version to be set"
            exit 1
          fi
          echo "PASS: uv-version=$ACTUAL"
      - name: Assert uv is available
        run: |
          if ! command -v uv &>/dev/null; then
            echo "FAIL: uv not found in PATH"
            exit 1
          fi
          echo "PASS: uv found at $(command -v uv)"
