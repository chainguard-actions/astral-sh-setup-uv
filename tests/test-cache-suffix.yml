name: Test cache-suffix in cache key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          enable-cache: "true"
          restore-cache: "false"
          save-cache: "false"
          ignore-nothing-to-cache: "true"
          cache-suffix: "my-test-suffix"
      - name: Assert cache-key contains suffix
        env:
          CACHE_KEY: ${{ steps.action.outputs.cache-key }}
          VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "cache-key: $CACHE_KEY"
          echo "uv-version: $VERSION"
          if [ "$VERSION" != "0.5.0" ]; then
            echo "FAIL: expected uv-version 0.5.0"
            exit 1
          fi
          case "$CACHE_KEY" in
            setup-uv-*-my-test-suffix) echo "PASS" ;;
            *) echo "FAIL: cache-key does not end with -my-test-suffix"; exit 1 ;;
          esac
