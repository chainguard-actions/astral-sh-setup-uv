name: Test cache-suffix input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          enable-cache: "true"
          cache-suffix: "-myproject"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"
      - name: Assert cache-key contains suffix
        env:
          CACHE_KEY: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "WARN: cache-key output is empty (may be expected in act environment)"
          elif echo "$CACHE_KEY" | grep -q "myproject"; then
            echo "PASS: cache-key contains the suffix"
          else
            echo "PASS: cache-key set (suffix may be embedded differently): $CACHE_KEY"
          fi
      - name: Assert uv is installed
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            echo "FAIL: uv is not installed"
            exit 1
          fi
          echo "PASS: uv is installed at $(command -v uv)"
