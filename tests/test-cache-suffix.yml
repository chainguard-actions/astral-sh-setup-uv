name: Test cache-suffix input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          cache-suffix: "-myproject"
          enable-cache: "true"
          save-cache: "false"
      - name: Assert uv-version output
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"
      - name: Assert cache-key contains suffix
        env:
          CACHE_KEY: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "cache-key: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "FAIL: cache-key output is empty"
            exit 1
          fi
          if [[ "$CACHE_KEY" != *"-myproject"* ]]; then
            echo "FAIL: cache-key '$CACHE_KEY' does not contain '-myproject'"
            exit 1
          fi
          echo "PASS: cache-key contains suffix"
