name: Test cache-suffix input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "latest"
          enable-cache: "true"
          cache-suffix: "-my-suffix"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: expected uv-version to be set"
            exit 1
          fi
          echo "PASS"
      - name: Assert uv is available
        run: |
          if ! command -v uv &>/dev/null; then
            echo "FAIL: uv command not found"
            exit 1
          fi
          echo "PASS: uv is available"
