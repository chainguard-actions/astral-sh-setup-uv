name: Test uv setup with cache-suffix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "0.5.0"
          enable-cache: "true"
          cache-suffix: "my-suffix"
          restore-cache: "true"
          save-cache: "false"
      - name: Assert uv-version output is set
        env:
          ACTUAL: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "actual uv-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$ACTUAL"
      - name: Assert cache-key output contains suffix
        env:
          ACTUAL: ${{ steps.setup-uv.outputs.cache-key }}
        run: |
          echo "actual cache-key: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: cache-key output is empty"
            exit 1
          fi
          if [[ "$ACTUAL" != *"my-suffix"* ]]; then
            echo "FAIL: cache-key does not contain 'my-suffix': $ACTUAL"
            exit 1
          fi
          echo "PASS: cache-key=$ACTUAL"
