name: Test activate-environment input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          activate-environment: "true"
          venv-path: "/tmp/test-venv"
          enable-cache: "false"
      - name: Assert uv-version output
        env:
          ACTUAL: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "actual uv-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$ACTUAL"
      - name: Assert venv output
        env:
          ACTUAL: ${{ steps.action.outputs.venv }}
        run: |
          echo "actual venv: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: venv output is empty when activate-environment=true"
            exit 1
          fi
          echo "PASS: venv=$ACTUAL"
      - name: Assert venv directory exists
        run: |
          if [ ! -d "/tmp/test-venv" ]; then
            echo "FAIL: venv directory /tmp/test-venv does not exist"
            exit 1
          fi
          echo "PASS: venv directory exists"
