name: Test activate-environment creates and activates venv
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          activate-environment: "true"
          no-project: "true"
          enable-cache: "false"
      - name: Assert venv output is set
        env:
          VENV: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "venv: $VENV"
          if [ -z "$VENV" ]; then
            echo "FAIL: venv output is empty"
            exit 1
          fi
          echo "PASS: venv=$VENV"
      - name: Assert venv directory exists
        env:
          VENV: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "Checking venv directory: $VENV"
          if [ ! -d "$VENV" ]; then
            echo "FAIL: venv directory does not exist at $VENV"
            exit 1
          fi
          echo "PASS: venv directory exists"
      - name: Assert VIRTUAL_ENV is set
        run: |
          echo "VIRTUAL_ENV: $VIRTUAL_ENV"
          if [ -z "$VIRTUAL_ENV" ]; then
            echo "FAIL: VIRTUAL_ENV environment variable is not set"
            exit 1
          fi
          echo "PASS: VIRTUAL_ENV=$VIRTUAL_ENV"
      - name: Assert python is available in venv
        run: |
          if ! command -v python &>/dev/null; then
            echo "FAIL: python not found in activated venv"
            exit 1
          fi
          echo "PASS: python is available"
          python --version
