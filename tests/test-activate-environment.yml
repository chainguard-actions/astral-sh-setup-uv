name: Test activate-environment input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-uv
        uses: .
        with:
          version: "0.5.0"
          activate-environment: "true"
          enable-cache: "false"

      - name: Assert venv output is set
        env:
          VENV_PATH: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "venv output: $VENV_PATH"
          if [ -z "$VENV_PATH" ]; then
            echo "FAIL: venv output is empty"
            exit 1
          fi
          echo "PASS: venv=$VENV_PATH"

      - name: Assert venv directory exists
        env:
          VENV_PATH: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "checking venv directory: $VENV_PATH"
          if [ ! -d "$VENV_PATH" ]; then
            echo "FAIL: venv directory does not exist at $VENV_PATH"
            exit 1
          fi
          echo "PASS: venv directory exists at $VENV_PATH"

      - name: Assert python is available in venv
        env:
          VENV_PATH: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "checking python in venv"
          if [ ! -f "$VENV_PATH/bin/python" ] && [ ! -f "$VENV_PATH/bin/python3" ]; then
            echo "FAIL: python not found in venv at $VENV_PATH/bin/"
            exit 1
          fi
          echo "PASS: python found in venv"
