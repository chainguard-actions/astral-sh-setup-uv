name: Test activate-environment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          activate-environment: "true"
          no-project: "true"
          venv-path: /tmp/test-venv
          python-version: "3.12"
      - name: Assert venv activated
        env:
          VENV: ${{ steps.action.outputs.venv }}
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
          RUNTIME_ID: ${{ steps.action.outputs.python-runtime-id }}
        run: |
          echo "uv-version: $UV_VERSION"
          echo "venv output: $VENV"
          echo "python-runtime-id: $RUNTIME_ID"
          echo "VIRTUAL_ENV: $VIRTUAL_ENV"
          if [ -z "$UV_VERSION" ]; then echo "FAIL: uv-version empty"; exit 1; fi
          if [ -z "$VENV" ]; then echo "FAIL: venv output empty"; exit 1; fi
          if [ ! -d "$VENV" ]; then echo "FAIL: venv dir missing"; exit 1; fi
          if [ -z "$VIRTUAL_ENV" ]; then echo "FAIL: VIRTUAL_ENV not set"; exit 1; fi
          case "$VENV" in
            /tmp/test-venv*) ;;
            *) echo "FAIL: venv not at custom path"; exit 1 ;;
          esac
          PY="$(command -v python)"
          echo "python: $PY"
          case "$PY" in
            /tmp/test-venv*) ;;
            *) echo "FAIL: python not from venv"; exit 1 ;;
          esac
          python --version
          python --version 2>&1 | grep -q "3\.12" || { echo "FAIL: expected Python 3.12"; exit 1; }
          echo "PASS"
