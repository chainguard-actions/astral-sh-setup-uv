name: Test activate-environment with python-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.8.0"
          python-version: "3.12"
          activate-environment: "true"
          no-project: "true"
          venv-path: ${{ runner.temp }}/test-venv
          enable-cache: "false"
      - name: Assert outputs and env
        env:
          VENV: ${{ steps.action.outputs.venv }}
          PYVER: ${{ steps.action.outputs.python-version }}
        run: |
          echo "venv: $VENV"
          echo "python-version: $PYVER"
          echo "UV_PYTHON: $UV_PYTHON"
          echo "VIRTUAL_ENV: $VIRTUAL_ENV"
          if [ -z "$VENV" ] || [ ! -d "$VENV" ]; then
            echo "FAIL: venv output missing or not a directory"
            exit 1
          fi
          case "$VENV" in
            *test-venv*) ;;
            *) echo "FAIL: venv path does not match venv-path"; exit 1 ;;
          esac
          if [ "$PYVER" != "3.12" ]; then
            echo "FAIL: expected python-version 3.12"
            exit 1
          fi
          if [ "$UV_PYTHON" != "3.12" ]; then
            echo "FAIL: expected UV_PYTHON=3.12"
            exit 1
          fi
          if [ -z "$VIRTUAL_ENV" ]; then
            echo "FAIL: VIRTUAL_ENV not set"
            exit 1
          fi
          PYOUT="$(python --version 2>&1)"
          echo "python: $PYOUT"
          case "$PYOUT" in
            *3.12*) echo "PASS" ;;
            *) echo "FAIL: expected python 3.12 from venv"; exit 1 ;;
          esac
