name: Test activate-environment feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          activate-environment: "true"

      - name: Assert venv output is set
        env:
          VENV: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "venv: $VENV"
          if [ -z "$VENV" ]; then
            echo "FAIL: venv output is empty"
            exit 1
          fi
          echo "PASS: venv=$VENV"

      - name: Assert venv directory exists
        env:
          VENV: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "venv path: $VENV"
          if [ ! -d "$VENV" ]; then
            echo "FAIL: venv directory '$VENV' does not exist"
            exit 1
          fi
          echo "PASS: venv directory exists"

      - name: Assert virtual environment is activated (VIRTUAL_ENV is set)
        run: |
          echo "VIRTUAL_ENV: $VIRTUAL_ENV"
          if [ -z "$VIRTUAL_ENV" ]; then
            echo "FAIL: VIRTUAL_ENV is not set — environment was not activated"
            exit 1
          fi
          echo "PASS: VIRTUAL_ENV=$VIRTUAL_ENV"
