name: Test virtual environment activation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "0.5.0"
          activate-environment: "true"
          enable-cache: "false"
          ignore-empty-workdir: "true"
      - name: Assert venv output is set
        env:
          VENV_PATH: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "venv output: $VENV_PATH"
          if [ -z "$VENV_PATH" ]; then
            echo "FAIL: venv output is empty"
            exit 1
          fi
          echo "PASS: venv=$VENV_PATH"
      - name: Assert venv directory exists
        env:
          VENV_PATH: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "Checking venv directory at: $VENV_PATH"
          if [ ! -d "$VENV_PATH" ]; then
            echo "FAIL: venv directory does not exist at $VENV_PATH"
            exit 1
          fi
          echo "PASS: venv directory exists"
      - name: Assert venv has python binary or symlink
        env:
          VENV_PATH: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "Checking for python in venv: $VENV_PATH"
          ls -la "$VENV_PATH/bin/" || true
          if [ ! -e "$VENV_PATH/bin/python" ] && [ ! -e "$VENV_PATH/bin/python3" ]; then
            echo "FAIL: no python binary found in venv at $VENV_PATH/bin/"
            exit 1
          fi
          echo "PASS: python binary found in venv"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"
