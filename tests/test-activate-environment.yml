name: Test activate-environment feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          activate-environment: "true"
          no-project: "true"

      - name: Assert venv output is set
        env:
          VENV: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "venv: $VENV"
          if [ -z "$VENV" ]; then
            echo "FAIL: venv output is empty"
            exit 1
          fi
          echo "PASS: venv output is set to $VENV"

      - name: Assert virtual environment directory exists
        env:
          VENV: ${{ steps.setup-uv.outputs.venv }}
        run: |
          echo "checking venv directory: $VENV"
          if [ ! -d "$VENV" ]; then
            echo "FAIL: venv directory does not exist at $VENV"
            exit 1
          fi
          if [ ! -f "$VENV/bin/python" ] && [ ! -f "$VENV/bin/python3" ]; then
            echo "FAIL: no python binary found in venv"
            exit 1
          fi
          echo "PASS: venv directory exists and contains python"

      - name: Assert python is available in the activated environment
        run: |
          if ! python --version 2>/dev/null && ! python3 --version 2>/dev/null; then
            echo "FAIL: python not available in activated environment"
            exit 1
          fi
          echo "PASS: python is available"
