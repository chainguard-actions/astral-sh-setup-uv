name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          checksum: "sha256:b4b7e5b3b5e5b3b5e5b3b5e5b3b5e5b3b5e5b3b5e5b3b5e5b3b5e5b3b5e5b3"
        continue-on-error: true
      - name: Assert action ran (checksum mismatch causes failure or uv installed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$UV_VERSION" ]; then
              echo "FAIL: action succeeded but uv-version output is empty"
              exit 1
            fi
            echo "PASS: uv installed with version=$UV_VERSION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected: checksum mismatch for fake checksum)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
