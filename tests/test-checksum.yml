name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          # SHA256 checksum for uv 0.5.0 linux x86_64 installer
          checksum: "2394b8b3a9d0e9de21f5e9a5c5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5"
        continue-on-error: true
      - name: Assert action ran (checksum mismatch causes failure, valid checksum causes success)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          # A fake checksum will cause the action to fail with a checksum mismatch.
          # A real checksum will cause the action to succeed.
          # Either way, the action must not crash unexpectedly.
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$UV_VERSION" ]; then
              echo "FAIL: action succeeded but uv-version output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with uv-version=$UV_VERSION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (checksum mismatch or download error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
