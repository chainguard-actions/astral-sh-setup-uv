name: Test uv setup with checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Install uv without checksum first to get the real checksum
      - id: get-version
        uses: .
        with:
          version: "0.5.0"
          enable-cache: "false"
      - name: Get checksum of installed uv binary
        id: get-checksum
        run: |
          UV_PATH="${{ steps.get-version.outputs.uv-path }}"
          echo "uv path: $UV_PATH"
          CHECKSUM=$(sha256sum "$UV_PATH" | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "Computed checksum: $CHECKSUM"
      # Now install again with the checksum input provided
      - id: action
        uses: .
        with:
          version: "0.5.0"
          checksum: ${{ steps.get-checksum.outputs.checksum }}
          enable-cache: "false"
      - name: Assert uv-version output
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS"
