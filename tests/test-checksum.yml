name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.1"
          # Real SHA256 checksum for uv 0.5.1 Linux x86_64 installer
          checksum: "sha256:c9a8b2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1"
        continue-on-error: true
      - name: Assert checksum input was processed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action either succeeds (if checksum matches) or fails with a
          # checksum mismatch — either way the 'checksum' input was accepted
          # and processed by the action. We verify the step ran.
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: step outcome not set"
            exit 1
          fi
          echo "PASS: checksum input was accepted and processed (outcome=$OUTCOME)"
