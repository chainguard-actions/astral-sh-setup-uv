name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Fetch known checksum for uv 0.5.18
        id: get-checksum
        run: |
          # The setup-uv action uses the uv binary checksum from GitHub releases.
          # For Linux x86_64, the asset is uv-x86_64-unknown-linux-gnu.tar.gz
          # Fetch the sha256 from the published checksums file.
          CHECKSUM=$(curl -sfL \
            "https://github.com/astral-sh/uv/releases/download/0.5.18/uv-x86_64-unknown-linux-gnu.tar.gz.sha256" \
            | awk '{print $1}')
          echo "checksum=$CHECKSUM"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          version: "0.5.18"
          checksum: ${{ steps.get-checksum.outputs.checksum }}
      - name: Assert uv installed with correct version
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          if [ "$UV_VERSION" != "0.5.18" ]; then
            echo "FAIL: expected version '0.5.18' but got '$UV_VERSION'"
            exit 1
          fi
          echo "PASS: uv installed with version $UV_VERSION and checksum verified"
      - name: Assert uv binary is executable
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            echo "FAIL: uv binary not found on PATH"
            exit 1
          fi
          echo "PASS: uv binary found at $(command -v uv)"
