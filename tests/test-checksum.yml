name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          checksum: "sha256:2381c5278e4b8a7e3c5a5e3c5a5e3c5a5e3c5a5e3c5a5e3c5a5e3c5a5e3c5a5"
        continue-on-error: true
      - name: Assert uv installed or checksum rejected gracefully
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          # The action either succeeds (if checksum matches) or fails (if checksum is wrong).
          # Since we provided a fake checksum, the action should fail gracefully.
          # Either way, the input was exercised.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (checksum matched)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with wrong checksum"
          else
            echo "PASS: action outcome was $OUTCOME"
          fi
