name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv without checksum first to get the real checksum
        id: get-checksum
        run: |
          # Download uv 0.5.0 and compute its sha256 for use in the next step
          curl -fsSL "https://github.com/astral-sh/uv/releases/download/0.5.0/uv-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/uv.tar.gz
          CHECKSUM=$(sha256sum /tmp/uv.tar.gz | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "Computed checksum: $CHECKSUM"
      - id: action
        uses: .
        with:
          version: "0.5.0"
          checksum: ${{ steps.get-checksum.outputs.checksum }}
          enable-cache: "false"
      - name: Assert uv-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert uv version matches expected
        run: |
          VERSION=$(uv --version | awk '{print $2}')
          echo "installed version: $VERSION"
          if [ "$VERSION" != "0.5.0" ]; then
            echo "FAIL: expected uv 0.5.0, got $VERSION"
            exit 1
          fi
          echo "PASS"
