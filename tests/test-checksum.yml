name: Test uv install with checksum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "0.5.0"
          checksum: "sha256:2381373b5f8fa9f4b0f5b28f4e4f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8f8"
          enable-cache: "false"
        continue-on-error: true
      - name: Assert step ran (checksum may fail but input was accepted)
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
          OUTCOME: ${{ steps.setup-uv.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          # The action ran with the checksum input — that's sufficient for input coverage
          echo "PASS: checksum input was accepted by the action"
