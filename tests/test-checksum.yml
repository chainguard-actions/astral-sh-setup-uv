name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Fetch real checksum for uv 0.5.0
        id: get-checksum
        run: |
          # Fetch the sha256 checksum for uv 0.5.0 linux x86_64 from the official release
          CHECKSUM=$(curl -sfL "https://github.com/astral-sh/uv/releases/download/0.5.0/uv-x86_64-unknown-linux-gnu.tar.gz.sha256" 2>/dev/null | awk '{print $1}' || echo "")
          echo "checksum=$CHECKSUM"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          version: "0.5.0"
          checksum: ${{ steps.get-checksum.outputs.checksum }}
        continue-on-error: true
      - name: Assert action ran with checksum input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
          CHECKSUM: ${{ steps.get-checksum.outputs.checksum }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          echo "checksum used: $CHECKSUM"
          # The checksum input is exercised. If we got a real checksum, the action
          # should succeed. If the checksum fetch failed (empty), the action may fail.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with checksum input"
            if ! command -v uv >/dev/null 2>&1; then
              echo "FAIL: uv not found on PATH after successful install"
              exit 1
            fi
            echo "PASS: uv found at $(command -v uv)"
          elif [ -z "$CHECKSUM" ]; then
            echo "INFO: checksum fetch failed, action failure is expected"
            echo "PASS: checksum input was exercised"
          else
            echo "FAIL: action failed despite having a valid checksum"
            exit 1
          fi
