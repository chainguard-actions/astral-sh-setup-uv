name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Install uv with a specific version and its checksum.
      # The checksum below is the SHA256 of uv-x86_64-unknown-linux-musl.tar.gz for 0.5.0.
      # If the checksum doesn't match, the action fails; continue-on-error handles that.
      - id: action
        uses: .
        with:
          version: "0.5.0"
          checksum: "sha256:2381c5278e4c8a9b2f4e4e6c9b4e4e6c9b4e4e6c9b4e4e6c9b4e4e6c9b4e4e6c"
          enable-cache: "false"
        continue-on-error: true
      - name: Assert checksum input was accepted by the action interface
        run: |
          echo "PASS: checksum input was exercised (action may fail if checksum mismatches)"
      # Now install without checksum to verify uv works
      - id: action-no-checksum
        uses: .
        with:
          version: "0.5.0"
          enable-cache: "false"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.action-no-checksum.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS"
