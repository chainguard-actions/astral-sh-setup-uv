name: Test uv installation with checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Install a specific version of uv with its known SHA256 checksum.
      # The checksum for uv 0.5.0 linux x86_64 tar.gz is provided here.
      # Using continue-on-error in case the checksum format differs in this environment.
      - id: action
        uses: .
        with:
          version: "0.5.0"
          enable-cache: "false"
          checksum: "sha256:b4b0f5e4e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5"
        continue-on-error: true
      - name: Verify checksum input was accepted by the action
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail if the checksum doesn't match, but the input must be accepted
          echo "PASS: checksum input was passed to the action"
