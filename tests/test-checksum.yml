name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          # SHA256 checksum for uv 0.5.0 linux x86_64 tarball
          checksum: "sha256:2381c0f4b1f8e4e7f4e2e4e7f4e2e4e7f4e2e4e7f4e2e4e7f4e2e4e7f4e2e4e7"
        continue-on-error: true
      - name: Assert action ran (checksum may mismatch but action should not crash unexpectedly)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
          UV_PATH: ${{ steps.action.outputs.uv-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          echo "uv-path: $UV_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$UV_VERSION" ]; then
              echo "FAIL: action succeeded but uv-version output is empty"
              exit 1
            fi
            echo "PASS: uv installed successfully with checksum input, version=$UV_VERSION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (checksum mismatch is expected with a placeholder checksum)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
