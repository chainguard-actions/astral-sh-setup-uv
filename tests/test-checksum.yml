name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "0.9.26"
          checksum: "30ccbf0a66dc8727a02b0e245c583ee970bdafecf3a443c1686e1b30ec4939e8"
          enable-cache: "false"
      - name: Assert uv-version output matches requested version
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ "$UV_VERSION" != "0.9.26" ]; then
            echo "FAIL: expected uv-version=0.9.26, got $UV_VERSION"
            exit 1
          fi
          echo "PASS: uv-version=0.9.26"
      - name: Assert uv binary is executable and works
        run: |
          echo "Running: uv --version"
          uv --version
          if [ $? -ne 0 ]; then
            echo "FAIL: uv --version failed"
            exit 1
          fi
          echo "PASS: uv is executable with verified checksum"
