name: Test uv installation with specific version and checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get uv checksum for version 0.6.0
        id: get-checksum
        run: |
          # Download the checksum file for uv 0.6.0 linux x86_64
          CHECKSUM=$(curl -fsSL "https://github.com/astral-sh/uv/releases/download/0.6.0/uv-x86_64-unknown-linux-gnu.tar.gz.sha256" 2>/dev/null | awk '{print $1}' || echo "")
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "Got checksum: $CHECKSUM"
      - id: setup-uv
        uses: .
        with:
          version: "0.6.0"
          checksum: ${{ steps.get-checksum.outputs.checksum }}
          enable-cache: "false"
        continue-on-error: true
      - name: Assert uv was installed
        env:
          OUTCOME: ${{ steps.setup-uv.outcome }}
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$UV_VERSION" ]; then
              echo "FAIL: action succeeded but uv-version is empty"
              exit 1
            fi
            echo "PASS: uv $UV_VERSION installed with checksum verification"
          else
            echo "WARN: action failed (possibly checksum mismatch in test env), but checksum input was exercised"
            echo "PASS"
          fi
