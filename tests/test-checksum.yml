name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get uv 0.5.0 checksum for verification
        id: get-checksum
        run: |
          # Download the sha256 checksum file for uv 0.5.0 Linux x86_64
          CHECKSUM=$(curl -sfL "https://github.com/astral-sh/uv/releases/download/0.5.0/uv-x86_64-unknown-linux-gnu.tar.gz.sha256" | awk '{print $1}')
          echo "checksum=$CHECKSUM"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          version: "0.5.0"
          checksum: ${{ steps.get-checksum.outputs.checksum }}
      - name: Assert uv-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "actual uv-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          if [ "$ACTUAL" != "0.5.0" ]; then
            echo "FAIL: expected uv-version '0.5.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: uv-version=$ACTUAL"
      - name: Assert uv is on PATH
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            echo "FAIL: uv not found on PATH"
            exit 1
          fi
          echo "PASS: uv found at $(command -v uv)"
          uv --version
