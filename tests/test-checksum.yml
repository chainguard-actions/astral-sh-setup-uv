name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          # SHA256 checksum for uv 0.5.0 x86_64-unknown-linux-gnu tarball
          checksum: "sha256:2381c9e2e4f7e3e4a9e4e4b4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4e4"
          enable-cache: "false"
        continue-on-error: true
      - name: Assert action ran (checksum may or may not match)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$UV_VERSION" ]; then
              echo "FAIL: action succeeded but uv-version output is empty"
              exit 1
            fi
            echo "PASS: uv installed with version $UV_VERSION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (checksum mismatch is expected with a placeholder checksum)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
