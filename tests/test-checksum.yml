name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Fetch checksum for uv 0.5.0
        id: fetch-checksum
        run: |
          CHECKSUM=$(curl -fsSL "https://github.com/astral-sh/uv/releases/download/0.5.0/uv-x86_64-unknown-linux-gnu.tar.gz.sha256" | awk '{print $1}')
          echo "checksum=sha256:$CHECKSUM" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          version: "0.5.0"
          enable-cache: "false"
          checksum: ${{ steps.fetch-checksum.outputs.checksum }}
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert installed version matches expected
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ "$UV_VERSION" != "0.5.0" ]; then
            echo "FAIL: expected version '0.5.0', got '$UV_VERSION'"
            exit 1
          fi
          echo "PASS"
