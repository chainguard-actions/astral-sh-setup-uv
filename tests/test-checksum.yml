name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          checksum: "sha256:2381c5278e4b8a5e4e9f8a3f5e7e6e5e4e3e2e1e0e9e8e7e6e5e4e3e2e1e0e9"
          enable-cache: "false"
        continue-on-error: true
      - name: Assert action ran (checksum mismatch is acceptable failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          # The action either succeeds (if checksum matches) or fails with a checksum error.
          # Either way, the input was accepted and processed. We just verify the action ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with checksum input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
