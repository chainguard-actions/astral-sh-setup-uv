name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          # SHA256 checksum for uv 0.5.0 linux x86_64 installer
          checksum: "2381c5278e8c9e4af5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5"
        continue-on-error: true
      - name: Assert action ran (checksum may mismatch with fake value, or succeed with real)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          # A fake checksum will cause the action to fail (checksum mismatch).
          # That is the expected behavior — the action correctly validates checksums.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected the mismatched checksum"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$UV_VERSION" ]; then
              echo "FAIL: action succeeded but uv-version output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with checksum validation"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
