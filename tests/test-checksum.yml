name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Fetch real checksum for uv 0.5.0
        id: get-checksum
        run: |
          CHECKSUM=$(curl -sfL \
            "https://github.com/astral-sh/uv/releases/download/0.5.0/uv-x86_64-unknown-linux-gnu.tar.gz.sha256" \
            | awk '{print $1}')
          echo "checksum=$CHECKSUM"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
      - id: setup-uv
        uses: .
        with:
          version: "0.5.0"
          checksum: ${{ steps.get-checksum.outputs.checksum }}
      - name: Assert uv-version output matches requested version
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version output: $UV_VERSION"
          if [ "$UV_VERSION" != "0.5.0" ]; then
            echo "FAIL: expected uv-version '0.5.0' but got '$UV_VERSION'"
            exit 1
          fi
          echo "PASS: uv-version output is correct"
      - name: Assert uv binary is installed and correct version
        run: |
          ACTUAL="$(uv --version | awk '{print $2}')"
          echo "uv --version: $ACTUAL"
          if [ "$ACTUAL" != "0.5.0" ]; then
            echo "FAIL: expected uv binary version '0.5.0' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: uv binary version is correct"
