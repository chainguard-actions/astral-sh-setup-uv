name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get uv checksum for version 0.5.0
        id: get-checksum
        run: |
          # Fetch the known SHA256 checksum for uv 0.5.0 linux x86_64 installer
          # This is the checksum for the uv-installer.sh script from the GitHub release
          CHECKSUM=$(curl -sfL "https://github.com/astral-sh/uv/releases/download/0.5.0/uv-x86_64-unknown-linux-gnu.tar.gz.sha256" 2>/dev/null | awk '{print $1}' || echo "")
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "Fetched checksum: $CHECKSUM"
      - id: action
        uses: .
        with:
          version: "0.5.0"
          checksum: ${{ steps.get-checksum.outputs.checksum }}
          enable-cache: "false"
        continue-on-error: true
      - name: Assert action ran with checksum input
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "uv-version: $UV_VERSION"
          # The action either succeeds (checksum matches) or fails (checksum mismatch/empty).
          # Either way, the input was accepted and processed.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action processed the checksum input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
