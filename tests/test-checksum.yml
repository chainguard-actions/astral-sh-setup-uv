name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          checksum: "sha256:2381c5278e4b8a7c7a7e5e3b5e5e3b5e5e3b5e5e3b5e5e3b5e5e3b5e5e3b5e5"
          enable-cache: "false"
        continue-on-error: true
      - name: Check action ran (checksum may fail with wrong value)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "PASS: checksum input was accepted by the action"
