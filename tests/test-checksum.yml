name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "0.3.1"
          checksum: "e11b01402ab645392c7ad6044db63d37e4fd1e745e015306993b07695ea5f9f8"
          enable-cache: "false"
      - name: Assert uv-version output matches expected
        env:
          ACTUAL: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "0.3.1" ]; then
            echo "FAIL: expected uv-version '0.3.1' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: uv-version=$ACTUAL"
      - name: Assert uv is executable and correct version
        run: |
          VERSION=$(uv --version 2>&1 | awk '{print $2}')
          echo "uv version: $VERSION"
          if [ "$VERSION" != "0.3.1" ]; then
            echo "FAIL: expected uv 0.3.1 but got $VERSION"
            exit 1
          fi
          echo "PASS"
