name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "0.5.0"
          enable-cache: "false"
          checksum: "sha256:b4a8e0f2c3d1e5f7a9b2c4d6e8f0a1b3c5d7e9f1a3b5c7d9e1f3a5b7c9d1e3f5"
        continue-on-error: true
      - name: Assert action ran with checksum input (not skipped)
        env:
          OUTCOME: ${{ steps.setup-uv.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run (succeed or fail) but not be skipped.
          # A 'skipped' outcome would mean the input was not processed at all.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with checksum input (outcome=$OUTCOME)"
