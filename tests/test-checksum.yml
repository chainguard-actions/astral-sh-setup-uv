name: Test checksum input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "0.5.0"
          checksum: "sha256:2381e8c7a7b9e4e0e4f0e4f0e4f0e4f0e4f0e4f0e4f0e4f0e4f0e4f0e4f0e4f"
          enable-cache: "false"
        continue-on-error: true
      - name: Assert action ran (checksum may fail for invalid hash, that is expected)
        env:
          OUTCOME: ${{ steps.setup-uv.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action either succeeds (valid checksum) or fails (invalid checksum).
          # We just verify the input was accepted and the action ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with checksum input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
