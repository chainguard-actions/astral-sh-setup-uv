name: Test cache with local path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "true"
          cache-local-path: "/tmp/uv-cache"
      - name: Assert uv is installed
        run: |
          if ! command -v uv &>/dev/null; then
            echo "FAIL: uv not found on PATH"
            exit 1
          fi
          echo "PASS: uv found at $(command -v uv)"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert cache-hit output is present (true or false)
        env:
          CACHE_HIT: ${{ steps.setup-uv.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ]; then
            echo "FAIL: cache-hit should be 'true' or 'false' when enable-cache is true, got '$CACHE_HIT'"
            exit 1
          fi
          echo "PASS: cache-hit is '$CACHE_HIT'"
      - name: Assert UV_CACHE_DIR points to local path
        run: |
          echo "UV_CACHE_DIR: $UV_CACHE_DIR"
          if [ "$UV_CACHE_DIR" != "/tmp/uv-cache" ]; then
            echo "FAIL: expected UV_CACHE_DIR='/tmp/uv-cache' but got '$UV_CACHE_DIR'"
            exit 1
          fi
          echo "PASS"
