name: Test uv setup with checksum and manifest-file inputs
on:
  workflow_dispatch:
jobs:
  test-manifest-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "0.5.0"
          manifest-file: "https://github.com/astral-sh/uv/releases/download/0.5.0/uv-installer.sh"
          enable-cache: "false"
        continue-on-error: true
      - name: Assert action ran with manifest-file input
        env:
          OUTCOME: ${{ steps.setup-uv.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail if the manifest URL is not in the expected format,
          # but we verify the inputs were accepted (action ran, not skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with manifest-file input (outcome=$OUTCOME)"

  test-checksum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "0.5.0"
          checksum: "sha256:invalid-checksum-for-testing-input-coverage"
          enable-cache: "false"
        continue-on-error: true
      - name: Assert action ran with checksum input
        env:
          OUTCOME: ${{ steps.setup-uv.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to checksum mismatch with an invalid checksum,
          # but we verify the inputs were accepted (action ran, not skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with checksum input (outcome=$OUTCOME)"
