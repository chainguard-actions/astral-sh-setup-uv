name: Test python-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          python-version: "3.11"

      - name: Assert python-version output is set
        env:
          PY_VERSION: ${{ steps.setup-uv.outputs.python-version }}
        run: |
          echo "python-version output: $PY_VERSION"
          if [ -z "$PY_VERSION" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          echo "PASS: python-version output is set to $PY_VERSION"

      - name: Assert UV_PYTHON env var is set correctly
        run: |
          echo "UV_PYTHON: $UV_PYTHON"
          if [ -z "$UV_PYTHON" ]; then
            echo "FAIL: UV_PYTHON environment variable is not set"
            exit 1
          fi
          echo "PASS: UV_PYTHON is set to $UV_PYTHON"

      - name: Assert uv can use the specified python version
        run: |
          echo "Running: uv python install 3.11"
          uv python install 3.11
          INSTALLED=$(uv run --python 3.11 python --version 2>&1)
          echo "Python version: $INSTALLED"
          if ! echo "$INSTALLED" | grep -q "3.11"; then
            echo "FAIL: expected Python 3.11 but got: $INSTALLED"
            exit 1
          fi
          echo "PASS: Python 3.11 is available via uv"
