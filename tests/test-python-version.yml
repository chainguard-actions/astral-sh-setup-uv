name: Test setup-uv with python-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          python-version: "3.11"
          enable-cache: "false"
      - name: Assert uv-version output
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"
      - name: Assert python-version output
        env:
          PYTHON_VERSION: ${{ steps.action.outputs.python-version }}
        run: |
          echo "python-version output: $PYTHON_VERSION"
          # python-version output may be empty if python is not installed yet
          # but the action should still succeed
          echo "PASS: python-version step completed"
