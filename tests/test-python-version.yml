name: Test python-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-uv
        uses: .
        with:
          version: "latest"
          python-version: "3.12"
          enable-cache: "false"
          ignore-empty-workdir: "true"

      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"

      - name: Assert UV_PYTHON env var is set to 3.12
        run: |
          echo "UV_PYTHON=$UV_PYTHON"
          if [ "$UV_PYTHON" != "3.12" ]; then
            echo "FAIL: expected UV_PYTHON='3.12', got '$UV_PYTHON'"
            exit 1
          fi
          echo "PASS: UV_PYTHON=$UV_PYTHON"

      - name: Assert uv is functional
        run: |
          uv --version
          echo "PASS"
