name: Test python-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          python-version: "3.11"
          ignore-empty-workdir: "true"
      - name: Assert UV_PYTHON env var is set
        run: |
          echo "UV_PYTHON: $UV_PYTHON"
          if [ -z "$UV_PYTHON" ]; then
            echo "FAIL: UV_PYTHON environment variable is not set"
            exit 1
          fi
          echo "PASS: UV_PYTHON=$UV_PYTHON"
      - name: Assert uv is functional
        run: |
          uv --version
          echo "PASS: uv runs successfully"
