name: Test Python version setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "0.5.0"
          python-version: "3.12"
          enable-cache: "false"
          ignore-empty-workdir: "true"
      - name: Assert python-version output is set
        env:
          PY_VERSION: ${{ steps.setup-uv.outputs.python-version }}
        run: |
          echo "python-version output: $PY_VERSION"
          if [ -z "$PY_VERSION" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          echo "PASS: python-version=$PY_VERSION"
      - name: Assert UV_PYTHON env var is set
        run: |
          echo "UV_PYTHON: $UV_PYTHON"
          if [ -z "$UV_PYTHON" ]; then
            echo "FAIL: UV_PYTHON environment variable is not set"
            exit 1
          fi
          echo "PASS: UV_PYTHON=$UV_PYTHON"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"
      - name: Assert uv runs correctly
        run: |
          VERSION=$(uv --version)
          echo "uv version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: uv --version returned empty"
            exit 1
          fi
          echo "PASS"
