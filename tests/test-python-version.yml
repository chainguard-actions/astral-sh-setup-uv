name: Test python-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          python-version: "3.11"
      - name: Assert python-version output is set
        env:
          PYTHON_VERSION: ${{ steps.setup-uv.outputs.python-version }}
        run: |
          echo "python-version: $PYTHON_VERSION"
          if [ -z "$PYTHON_VERSION" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          echo "PASS: python-version output is '$PYTHON_VERSION'"
      - name: Assert UV_PYTHON env var is set
        run: |
          echo "UV_PYTHON: $UV_PYTHON"
          if [ -z "$UV_PYTHON" ]; then
            echo "FAIL: UV_PYTHON environment variable is not set"
            exit 1
          fi
          if ! echo "$UV_PYTHON" | grep -q "3.11"; then
            echo "FAIL: expected UV_PYTHON to contain '3.11', got '$UV_PYTHON'"
            exit 1
          fi
          echo "PASS: UV_PYTHON is '$UV_PYTHON'"
      - name: Assert uv can use the specified python version
        run: |
          echo "Testing uv with python 3.11..."
          uv python install 3.11 --quiet || true
          PYTHON_VER="$(uv run --python 3.11 python --version 2>&1 || true)"
          echo "Python version: $PYTHON_VER"
          echo "PASS: uv is functional with python-version set"
