name: Test python-version input sets UV_PYTHON
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          python-version: "3.12"

      - name: Assert python-version output is set
        env:
          PY_VERSION: ${{ steps.setup-uv.outputs.python-version }}
        run: |
          echo "python-version output: $PY_VERSION"
          if [ -z "$PY_VERSION" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          echo "PASS: python-version=$PY_VERSION"

      - name: Assert UV_PYTHON env var is set
        run: |
          echo "UV_PYTHON: $UV_PYTHON"
          if [ -z "$UV_PYTHON" ]; then
            echo "FAIL: UV_PYTHON environment variable is not set"
            exit 1
          fi
          echo "PASS: UV_PYTHON=$UV_PYTHON"

      - name: Assert uv can use the specified Python version
        run: |
          echo "Testing uv with python 3.12..."
          uv python install 3.12 --quiet || true
          uv run --python 3.12 python --version
          echo "PASS: uv can use python 3.12"
