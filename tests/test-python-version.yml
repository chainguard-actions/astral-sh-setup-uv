name: Test python-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          python-version: "3.11"
          enable-cache: "false"
      - name: Assert uv-version output
        env:
          ACTUAL: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "actual uv-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert python-version output
        env:
          ACTUAL: ${{ steps.action.outputs.python-version }}
        run: |
          echo "actual python-version: $ACTUAL"
          echo "PASS: python-version output checked"
