name: Test python-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
          python-version: "3.12"

      - name: Assert python-version output is set
        env:
          PY_VERSION: ${{ steps.setup-uv.outputs.python-version }}
        run: |
          echo "python-version: $PY_VERSION"
          if [ -z "$PY_VERSION" ]; then
            echo "FAIL: python-version output is empty"
            exit 1
          fi
          echo "PASS: python-version=$PY_VERSION"

      - name: Assert UV_PYTHON env var is set
        run: |
          echo "UV_PYTHON: $UV_PYTHON"
          if [ -z "$UV_PYTHON" ]; then
            echo "FAIL: UV_PYTHON environment variable is not set"
            exit 1
          fi
          echo "PASS: UV_PYTHON=$UV_PYTHON"

      - name: Assert uv can use the specified python version
        run: |
          uv python install 3.12
          ACTUAL=$(uv run --python 3.12 python --version 2>&1)
          echo "python version: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "3.12"; then
            echo "FAIL: expected Python 3.12 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: Python 3.12 is available via uv"
