name: Test basic usage - install latest uv
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version is set to $UV_VERSION"
      - name: Assert uv is on PATH and executable
        run: |
          if ! command -v uv &>/dev/null; then
            echo "FAIL: uv not found on PATH"
            exit 1
          fi
          echo "PASS: uv found at $(command -v uv)"
      - name: Assert uv version matches output
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          ACTUAL_VERSION="$(uv --version | awk '{print $2}')"
          echo "actual version from binary: $ACTUAL_VERSION"
          echo "output uv-version: $UV_VERSION"
          if [ "$ACTUAL_VERSION" != "$UV_VERSION" ]; then
            echo "FAIL: binary version '$ACTUAL_VERSION' does not match output '$UV_VERSION'"
            exit 1
          fi
          echo "PASS"
