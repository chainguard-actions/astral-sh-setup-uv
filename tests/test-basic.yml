name: Test basic uv installation (latest)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          enable-cache: "false"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"
      - name: Assert uv-path output is set
        env:
          UV_PATH: ${{ steps.setup-uv.outputs.uv-path }}
        run: |
          echo "uv-path: $UV_PATH"
          if [ -z "$UV_PATH" ]; then
            echo "FAIL: uv-path output is empty"
            exit 1
          fi
          echo "PASS: uv-path=$UV_PATH"
      - name: Assert uvx-path output is set
        env:
          UVX_PATH: ${{ steps.setup-uv.outputs.uvx-path }}
        run: |
          echo "uvx-path: $UVX_PATH"
          if [ -z "$UVX_PATH" ]; then
            echo "FAIL: uvx-path output is empty"
            exit 1
          fi
          echo "PASS: uvx-path=$UVX_PATH"
      - name: Assert uv binary is executable
        env:
          UV_PATH: ${{ steps.setup-uv.outputs.uv-path }}
        run: |
          echo "Checking uv binary at: $UV_PATH"
          if [ ! -x "$UV_PATH" ]; then
            echo "FAIL: uv binary is not executable at $UV_PATH"
            exit 1
          fi
          echo "PASS: uv binary is executable"
      - name: Assert uv is on PATH
        run: |
          if ! command -v uv &>/dev/null; then
            echo "FAIL: uv not found on PATH"
            exit 1
          fi
          echo "PASS: uv found at $(command -v uv)"
