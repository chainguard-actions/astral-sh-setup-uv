name: Test basic pinned version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.6.0"
          enable-cache: "false"
      - name: Assert outputs
        env:
          VERSION: ${{ steps.action.outputs.uv-version }}
          UV_PATH: ${{ steps.action.outputs.uv-path }}
          UVX_PATH: ${{ steps.action.outputs.uvx-path }}
        run: |
          echo "version: $VERSION"
          echo "uv-path: $UV_PATH"
          echo "uvx-path: $UVX_PATH"
          if [ "$VERSION" != "0.6.0" ]; then
            echo "FAIL: expected uv-version 0.6.0"; exit 1
          fi
          if [ ! -x "$UV_PATH" ]; then
            echo "FAIL: uv-path not executable"; exit 1
          fi
          if [ ! -x "$UVX_PATH" ]; then
            echo "FAIL: uvx-path not executable"; exit 1
          fi
          echo "PASS"
      - name: Assert uv on PATH
        run: |
          OUT="$(uv --version)"
          echo "uv --version: $OUT"
          if ! echo "$OUT" | grep -q "0.6.0"; then
            echo "FAIL: uv on PATH is not 0.6.0"; exit 1
          fi
          echo "PASS"
