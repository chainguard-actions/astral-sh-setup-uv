name: Test basic usage - install latest uv
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-uv
        uses: .
        with:
          version: "latest"
          enable-cache: "false"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version is '$UV_VERSION'"
      - name: Assert uv-path output is set
        env:
          UV_PATH: ${{ steps.setup-uv.outputs.uv-path }}
        run: |
          echo "uv-path: $UV_PATH"
          if [ -z "$UV_PATH" ]; then
            echo "FAIL: uv-path output is empty"
            exit 1
          fi
          echo "PASS: uv-path is '$UV_PATH'"
      - name: Assert uvx-path output is set
        env:
          UVX_PATH: ${{ steps.setup-uv.outputs.uvx-path }}
        run: |
          echo "uvx-path: $UVX_PATH"
          if [ -z "$UVX_PATH" ]; then
            echo "FAIL: uvx-path output is empty"
            exit 1
          fi
          echo "PASS: uvx-path is '$UVX_PATH'"
      - name: Assert uv binary is on PATH and executable
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            echo "FAIL: uv not found on PATH"
            exit 1
          fi
          UV_ACTUAL_VERSION="$(uv --version)"
          echo "uv version: $UV_ACTUAL_VERSION"
          echo "PASS: uv is available on PATH"
