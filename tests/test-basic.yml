name: Test basic usage - install latest uv
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare cache directory
        run: mkdir -p /tmp/uv-cache
      - id: action
        uses: .
        with:
          version: "latest"
          github-token: ${{ github.token }}
          cache-local-path: /tmp/uv-cache
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version is '$UV_VERSION'"
      - name: Assert uv is on PATH and executable
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            echo "FAIL: uv not found on PATH"
            exit 1
          fi
          UV_BIN_VERSION="$(uv --version)"
          echo "uv binary version: $UV_BIN_VERSION"
          echo "PASS: uv is available"
