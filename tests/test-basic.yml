name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.5.0"
          enable-cache: "false"
      - name: Assert uv-version output
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS: uv-version=$UV_VERSION"
      - name: Assert uv-path output
        env:
          UV_PATH: ${{ steps.action.outputs.uv-path }}
        run: |
          echo "uv-path: $UV_PATH"
          if [ -z "$UV_PATH" ]; then
            echo "FAIL: uv-path output is empty"
            exit 1
          fi
          if [ ! -f "$UV_PATH" ]; then
            echo "FAIL: uv binary not found at $UV_PATH"
            exit 1
          fi
          echo "PASS: uv binary exists at $UV_PATH"
      - name: Assert uvx-path output
        env:
          UVX_PATH: ${{ steps.action.outputs.uvx-path }}
        run: |
          echo "uvx-path: $UVX_PATH"
          if [ -z "$UVX_PATH" ]; then
            echo "FAIL: uvx-path output is empty"
            exit 1
          fi
          echo "PASS: uvx-path=$UVX_PATH"
      - name: Assert uv is runnable
        run: |
          uv --version
          echo "PASS: uv is on PATH and runnable"
