name: Test basic uv setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "latest"
          python-version: "3.12"
          enable-cache: "false"
      - name: Assert uv-version output is set
        env:
          UV_VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "uv-version: $UV_VERSION"
          if [ -z "$UV_VERSION" ]; then
            echo "FAIL: uv-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert uv-path output is set
        env:
          UV_PATH: ${{ steps.action.outputs.uv-path }}
        run: |
          echo "uv-path: $UV_PATH"
          if [ -z "$UV_PATH" ]; then
            echo "FAIL: uv-path output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert uv binary is executable
        run: |
          uv --version
          echo "PASS: uv is available in PATH"
