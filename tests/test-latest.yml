name: Test latest version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          enable-cache: "false"
      - name: Assert version output looks like semver and matches uv
        env:
          VERSION: ${{ steps.action.outputs.uv-version }}
        run: |
          echo "uv-version: $VERSION"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: uv-version is not a version"
            exit 1
          fi
          OUT="$(uv --version)"
          echo "uv --version: $OUT"
          case "$OUT" in
            *"$VERSION"*) echo "PASS" ;;
            *) echo "FAIL: uv --version does not match output"; exit 1 ;;
          esac
